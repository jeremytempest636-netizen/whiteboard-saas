# Whiteboard stack: 2 API nodes behind nginx, Postgres primary + streaming
# replica, Redis, and the Next.js web app.
#
#   cp .env.example .env && docker compose up --build
#   open http://localhost:3000
name: whiteboard

x-api: &api
  build:
    context: ./backend
  restart: unless-stopped
  depends_on:
    postgres-primary: { condition: service_healthy }
    postgres-replica: { condition: service_healthy }
    redis:            { condition: service_healthy }
  environment: &api-env
    APP_ENV: production
    LOG_LEVEL: info
    HTTP_ADDR: ":8080"
    TRUST_PROXY: "true"
    ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}
    AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in .env (32+ chars)}
    POSTGRES_MASTER_DSN: host=postgres-primary user=${POSTGRES_USER:-whiteboard} password=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-whiteboard} port=5432 sslmode=disable
    POSTGRES_REPLICA_DSN: host=postgres-replica user=${POSTGRES_USER:-whiteboard} password=${POSTGRES_PASSWORD} dbname=${POSTGRES_DB:-whiteboard} port=5432 sslmode=disable
    REDIS_ADDRS: redis:6379
    WORKERS: "8"
    SNAPSHOT_DEBOUNCE: 2s
    SNAPSHOT_MAX_WAIT: 15s
  stop_grace_period: 30s

services:
  postgres-primary:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-whiteboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-whiteboard}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD:?set POSTGRES_REPLICATION_PASSWORD}
    command: >
      postgres
      -c wal_level=replica
      -c max_wal_senders=10
      -c max_replication_slots=10
      -c hot_standby=on
    volumes:
      - pg-primary:/var/lib/postgresql/data
      - ./deploy/postgres/primary-init.sh:/docker-entrypoint-initdb.d/10-replication.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  postgres-replica:
    image: postgres:16-alpine
    restart: unless-stopped
    depends_on:
      postgres-primary: { condition: service_healthy }
    user: postgres
    environment:
      PRIMARY_HOST: postgres-primary
      POSTGRES_USER: ${POSTGRES_USER:-whiteboard}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-whiteboard}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      PGDATA: /var/lib/postgresql/data
    entrypoint: ["/bin/bash", "/replica-entrypoint.sh"]
    volumes:
      - pg-replica:/var/lib/postgresql/data
      - ./deploy/postgres/replica-entrypoint.sh:/replica-entrypoint.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-whiteboard}"]
      interval: 3s
      timeout: 3s
      retries: 40

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api1:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: api1

  api2:
    <<: *api
    environment:
      <<: *api-env
      NODE_ID: api2

  gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on: [api1, api2]
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  web:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost:8080}
    restart: unless-stopped
    depends_on: [gateway]
    ports:
      - "3000:3000"

volumes:
  pg-primary:
  pg-replica:
  redis-data:
