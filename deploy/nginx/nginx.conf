# Load balancer in front of the API nodes. WebSocket upgrades are forwarded;
# `least_conn` spreads long-lived sockets evenly. Any node can serve any board
# because rooms are synchronised through Redis.
worker_processes auto;

events { worker_connections 4096; }

http {
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream api {
    least_conn;
    server api1:8080 max_fails=2 fail_timeout=5s;
    server api2:8080 max_fails=2 fail_timeout=5s;
    keepalive 32;
  }

  server {
    listen 80;

    location /ws/ {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
    }

    location / {
      proxy_pass http://api;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
  }
}
